<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ICT-Tutka</title>
</head>
<body>

<input  type="text" id="texting" placeholder="Type something" >
<h1>ICT tuen sijainti nyt</h1>
<div id="displayDiv"></div>

<script>
let text = document.getElementById("texting");
let output = document.getElementById("displayDiv");

document.addEventListener("keydown", event => {
    switch(event.key) {
      case "ArrowDown":
         event.preventDefault();
         output.textContent = "Pois";
         break;
    }
})

document.addEventListener("keyup", event => {
    switch(event.key) {
      case "ArrowUp":
         event.preventDefault();
         output.textContent = "Paikalla";
         break;
    }
})

text.addEventListener("keydown", (ev) => {
   if (ev.key === "Enter") {
       output.textContent = text.value;
   }
})


</script>

</body>
</html>
