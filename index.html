<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>ICT-Tutka</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>

 <div class="outputContainerDiv">   
  <h1>ICT tuen sijainti nyt</h1>

  <div id="displayDiv"></div>
  <div id="displayDivInfo"></div>
 </div>

<div id="editMode">
<input  type="text" id="texting" placeholder="Kirjoita jotain" >
<button id="showHideButton">Lähetä</button>
</div>

<script>
let text = document.getElementById("texting");
let output = document.getElementById("displayDiv");

let displayDivInfo = document.getElementById("displayDivInfo");

let edit = document.getElementById("editMode");
let hideShow = document.getElementById("showHideButton");

document.addEventListener("keydown", event => {
    switch(event.key) {
      case "ArrowDown":
         event.preventDefault();
         output.textContent = "Poissa";
         displayDivInfo.textContent = "Laurin numero: 044-423 5888";
         
         break;
       case "ArrowRight":
          event.preventDefault();
          output.textContent = "Ruokatauolla";
          break;
        break;
        case "ArrowLeft":
          event.preventDefault();
          output.textContent = "Suljettu";
          break;
        case "ArrowUp":
         event.preventDefault();
         output.textContent = "Paikalla";
         break;  
              
       
    }
});

hideShow.addEventListener("click", (ev) => {
   output.textContent = text.value;
});


text.addEventListener("keydown", (ev) => {
   if (ev.key === "Enter") {
       output.textContent = text.value;
   }
})
</script>

</body>
</html>
